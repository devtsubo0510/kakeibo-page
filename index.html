<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>
  <header>
    <h1>家計簿</h1>
    <h2>家計簿をつけましょう</h2>

  </header>

  <main>
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿に登録</h2>
      <form id="entry-form">
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" required>
        </p>
        <p>
          <label for="entry-type">区分</label>
          <select id="entry-type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="number" id="entry-amount" name="amount" min="1" step="1" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <section aria-labelledby="total-heading">
      <h2 id="total-heading">現在の残高</h2>
      <p><output id="balance-output" aria-label="収入から支出を差し引いた残高" aria-live="polite">0円</output></p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録済みデータ</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額</th>
          </tr>
        </thead>
        <tbody id="entry-list"></tbody>
      </table>
    </section>
  </main>
</body>

</html>
